name: Train dual-platform net-wallet models V2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dual-year-training-v2
  cancel-in-progress: false

jobs:
  train:
    if: github.repository == 'zfy06011/cs2-market-data' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      RUN_DIR: .local/dual-year-training-v2
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check collectors and install pinned dependencies
        run: |
          npm run check
          node --check scripts/collect-dual-training.mjs
          npm test
          python -m pip install --disable-pip-version-check -r requirements-training-v2.txt
      - name: Check source, label, role and budget contracts
        run: python -m unittest discover -s training -p 'test_*.py' -v
      - name: Freeze execution plans
        run: |
          mkdir -p "$RUN_DIR"
          cp config/dual-training.json "$RUN_DIR/experiment-plan.json"
          cp config/dual-model.json "$RUN_DIR/model-plan.json"
      - name: Collect bounded three-market history
        run: node scripts/collect-dual-training.mjs --live config/dual-training.json "$RUN_DIR/input"
      - name: Train and evaluate frozen dual-platform method
        run: python training/dual_train.py --root "$RUN_DIR" --output "$RUN_DIR/results"
      - name: Write experiment summary
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          report = Path(os.environ["RUN_DIR"]) / "results/report.md"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(report.read_text(encoding="utf-8"))
          PY
      - name: Retain models and reports without complete history
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dual-year-training-v2
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .local/dual-year-training-v2/input/collection.json
            .local/dual-year-training-v2/results/*.joblib
            .local/dual-year-training-v2/results/*.json
            .local/dual-year-training-v2/results/report.md
            .local/dual-year-training-v2/results/test-predictions.jsonl
            .local/dual-year-training-v2/results/source-snapshot/
